version: "3.6"
services:
    nginx:
        restart: always
        container_name: nginx
        build:
            context: .
            dockerfile: docker/nginx.Dockerfile
        ports:
            - 443:443
        links:
            - fpm
        volumes:
          - ./:/var/www/realedition
    fpm:
        restart: always
        container_name: fpm
        build:
            context:  .
            dockerfile: docker/fpm.Dockerfile
        volumes:
            - ./:/var/www/realedition
    mssql:
        restart: always
        container_name: mssql
        image: mcr.microsoft.com/mssql/server:2019-latest
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the environment}
            - MSSQL_PID=Enterprise
            - MSSQL_AGENT_ENABLED=True
            - TZ=Europe/Moscow
            - MSSQL_COLLATION=Cyrillic_General_CI_AS
            - MSSQL_LCID=1049
        ports:
            - 127.0.0.1:1433:1433
        volumes:
            - ./data:/var/opt/mssql/data
